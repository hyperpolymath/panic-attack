# SPDX-License-Identifier: MPL-2.0
[package]
name = "panic-attack"
version = "2.5.5"
edition = "2021"
# MSRV. Set by the highest `rust-version` in the dependency graph, which is
# tree-sitter 0.27 (1.90); the pin is exact and deliberate, so the baseline
# follows it rather than the other way round. This is a promise the `msrv` job
# enforces on every pull request — bumping a dependency that needs a newer
# compiler fails the build rather than the user's install.
rust-version = "1.90"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
license-file = "LICENSE"
description = "Universal static analysis, stress testing, and logic-based bug signature detection for 49 languages"
repository = "https://github.com/hyperpolymath/panic-attack"

[dependencies]
tree-sitter = "=0.27.0"
tree-sitter-php = "=0.25.1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
colored = "3.1"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JCS (RFC 8785) for JSON artefacts: the estate tool behind JSON-POLICY rule
# J-1. Not on crates.io, so pinned to a full commit SHA.
ijson-jcs = { git = "https://github.com/hyperpolymath/ijson-jcs", rev = "3a9a4ee326a968a32b2f152b4faec243a2d00765" }
# Pure safe-Rust YAML (replaces serde_yaml + unsafe-libyaml, RUSTSEC-2024-0449).
serde-saphyr = "2.0"
regex = "1.10"
chrono = "0.4"
filetime = "0.2"
encoding_rs = "0.8"
crossterm = "0.29"
eframe = { version = "0.37", optional = true }
rayon = "1.12"
blake3 = { version = "1.8", features = ["mmap"] }
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
walkdir = "2.5"
toml_edit = { version = "0.23", default-features = false, features = ["parse"], optional = true }
dirs = "7.0"
ed25519-dalek = { version = "3.0", optional = true }
ureq = { version = "3.3", optional = true }

[features]
default = []
signing = ["ed25519-dalek"]
http = ["ureq", "dep:toml_edit"]
sarif = []
# Native GUI viewer (eframe/egui). Opt-in because eframe raises MSRV above the
# 1.90 baseline; default builds remain pure-CLI and MSRV-clean.
gui = ["eframe"]

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "scan_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[[bin]]
name = "panic-attack"
path = "src/main.rs"
