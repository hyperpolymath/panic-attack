# SPDX-License-Identifier: MPL-2.0
[package]
name = "panic-attack"
version = "2.5.5"
edition = "2021"
rust-version = "1.85.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
license-file = "LICENSE"
description = "Universal static analysis, stress testing, and logic-based bug signature detection for 49 languages"
repository = "https://github.com/hyperpolymath/panic-attack"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
colored = "3.1"
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
chrono = "0.4"
filetime = "0.2"
encoding_rs = "0.8"
crossterm = "0.29"
eframe = { version = "0.35", optional = true }
rayon = "1.12"
blake3 = { version = "1.8", features = ["mmap"] }
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
walkdir = "2.5"
dirs = "6.0"
ed25519-dalek = { version = "3.0", optional = true }
ureq = { version = "3.3", optional = true }

[features]
default = []
signing = ["ed25519-dalek"]
http = ["ureq"]
# Native GUI viewer (eframe/egui). Opt-in because eframe raises MSRV above the
# 1.85.0 baseline; default builds remain pure-CLI and MSRV-clean.
gui = ["eframe"]

[dev-dependencies]
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "scan_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[[bin]]
name = "panic-attack"
path = "src/main.rs"
